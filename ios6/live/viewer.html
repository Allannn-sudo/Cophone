<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cophone · 执行观察</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10171e;color:#e9f1f4;font:15px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1160px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}h2{font-size:15px;color:#9fb3c2;margin:0 0 12px}.pill,button{padding:7px 13px;border-radius:18px;background:#283440;color:#b7c7d1;border:0}.live,.selected{background:#153d35;color:#7ce4c6}button{cursor:pointer;margin:4px 8px 4px 0;font:inherit}nav{margin:24px 0}.layout{display:grid;grid-template-columns:360px 1fr;gap:26px}.screen{width:322px;min-height:462px;border:1px solid #3a4854;background:#1b252e;border-radius:8px;overflow:hidden;position:relative}.screen img{width:320px;height:460px;display:block}.empty{padding:36px 24px;color:#a9bcc8;position:absolute;inset:0;background:#1b252e}.card{background:#1a252f;border:1px solid #2c3a46;border-radius:12px;padding:20px;margin-bottom:18px}.muted{color:#91a7b6;font-size:13px}.goal{font-size:21px;margin:6px 0 12px;word-break:break-word}.trace{border-left:2px solid #385b69;padding-left:16px;margin:14px 0}.trace strong{color:#7ce4c6}.trace p{margin:4px 0}.small{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;color:#8099aa}.foot{margin-top:16px;font-size:13px;color:#93a9b7}.content{white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto}.preview{display:block;max-width:100%;max-height:520px;margin:auto;border-radius:6px}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:18px}}
</style><main><header><h1>cophone <span class="muted">执行观察</span></h1><span id="badge" class="pill">等待手机</span></header><nav id="tasks"></nav><div class="layout"><section><div class="card"><h2 id="sourceTitle">手机端实际执行数据</h2><div id="goal" class="goal">等待交办</div><div id="status" class="muted"></div><p id="message" class="muted"></p><div id="id" class="small"></div></div><div id="appFrame" hidden><h2>oldbili · 真实后台控制器画面</h2><div class="screen"><img id="frame" hidden alt="手机实际渲染的 oldbili 搜索控制器"><div id="empty" class="empty">等待本轮真实 App 画面，不用进度提示代替投屏。</div></div><div class="foot" id="frameInfo"></div><div class="foot">来自未接入手机窗口的真实 SearchViewController；不是整个后台桌面的投屏。</div></div><div id="inputCard" class="card" hidden><h2>用户确认的实际选文</h2><div id="input" class="content"></div></div><div class="foot">USB 只读观察。摘要、配图、目视官展示真实输入、采集数据和返回结果，属于执行数据面板，不是伪造的 App 截图。手机仍由你正常使用。</div></section><section><div id="observationsCard" class="card" hidden><h2>目视官 · 实际读取内容</h2><div id="observations" class="content"></div></div><div id="traceCard" class="card"><h2>实际动作与状态</h2><div id="trace" class="muted"></div></div><div class="card"><h2 id="resultHeading">结果与保存验证</h2><p id="result" class="muted"></p><img id="preview" class="preview" hidden alt="本次手机收到的实际生成图片"><div id="output" class="content"></div></div></section></div></main>
<script>
const el=id=>document.getElementById(id);let selected='',manual=false,generation='',previewGeneration='',lastNewest='';const kinds={oldbili:'找视频',summarize:'摘要',illustrate:'配图',review:'目视官'};const names={planning:'根据真实观察规划下一步',operating:'正在操作 oldbili',saving:'正在保存与核对',completed:'已保存并回读确认',failed:'任务未完成',cancelled:'已停止',uncertain:'结果未确认，未自动重放',queued:'已排队',waiting_config:'等待配置 API Key',submitting:'正在提交手机 API 请求',running:'千问正在生成图片',downloading:'手机正在下载图片',result_ready:'真实结果已返回，正在保存',saving_photo:'正在保存照片',filing_album:'正在归入 cophone 相簿',album_pending:'图片已保存，相簿核对待完成',awaiting_leave:'已启动，等待离开 cophone',recording:'正在采集本轮使用内容',finishing:'正在整理并写入备忘录',paused:'已暂停'};const terminal=new Set(['completed','failed','cancelled','uncertain','paused']);
function text(id,value){el(id).textContent=value||''}function time(v){return typeof v==='number'?new Date(v*1000).toLocaleTimeString():''}function show(id,visible){el(id).hidden=!visible}
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'});const s=await r.json(),e=s.execution||{},all=e.tasks||[],f=s.frame||{},fresh=s.connected&&s.dataLive&&e.online&&Math.abs(Date.now()/1000-e.capturedAt)<6;
const sorted=[...all].sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)),newest=(sorted[0]||{}).id||'';if(!all.some(t=>t.id===selected)||(!manual&&newest!==lastNewest))selected=newest;lastNewest=newest;const t=all.find(t=>t.id===selected)||{};
el('badge').className='pill'+(fresh?' live':'');text('badge',fresh?'实时执行数据':s.connected?'最后一次数据':'未连接');const buttons=el('tasks');buttons.replaceChildren();for(const x of sorted){const b=document.createElement('button');b.textContent=kinds[x.kind]+' · '+(terminal.has(x.status)?'已结束':'执行中');b.className=x.id===selected?'selected':'';b.onclick=()=>{selected=x.id;manual=true;updateSelection();};buttons.append(b)}
text('sourceTitle',(kinds[t.kind]||'手机端')+' · 实际执行数据');text('goal',t.goal||'等待交办');text('status',names[t.status]||t.status);text('message',fresh?'手机服务在线 · '+time(e.capturedAt):s.message);text('id',t.id?'任务 '+t.id:'');show('inputCard',!!t.input);text('input',t.input);show('appFrame',t.kind==='oldbili');
const same=f.taskID===t.id,live=fresh&&s.live&&Math.abs(Date.now()/1000-f.capturedAt)<6;if(t.kind==='oldbili'&&s.hasImage&&same){if(generation!==s.generation){el('frame').src='/frame.png?v='+encodeURIComponent(s.generation);generation=s.generation;}show('frame',true);show('empty',false);text('frameInfo',(live?'实时画面':'最后一帧')+' · '+time(f.capturedAt)+' · '+(f.query||'')+' · '+(f.status||''));}else{show('frame',false);show('empty',true);text('frameInfo','尚无本轮实际 App 画面');}
show('observationsCard',t.kind==='review');let observations=[];for(const v of t.visits||[])observations.push('应用：'+(v.name||v.bundle||'未识别')+' · '+time(v.start)+'—'+time(v.end));for(const p of t.pages||[])observations.push('网页：'+(p.title||'')+'\n'+(p.url||'')+(p.excerpt?'\n'+p.excerpt:''));for(const v of t.videos||[])observations.push('视频：'+(v.title||'')+'\nUP主：'+(v.author||'未提供')+'\n'+(v.description||''));text('observations',observations.join('\n\n')||'等待实际采集；未读取的内容不会补写。');
const box=el('trace');box.replaceChildren();for(const step of t.trace||[]){const d=document.createElement('div');d.className='trace';const strong=document.createElement('strong');strong.textContent=step.action?(step.step+' · '+step.action):time(step.time);const p=document.createElement('p');p.textContent=step.reason||step.message||'';const q=document.createElement('div');q.className='small';q.textContent=step.query||((step.ids||[]).join(' / '));d.append(strong,p,q);box.append(d);}if(!box.children.length)box.textContent=t.kind==='illustrate'?'选文确认 → 手机直连千问 → 查询生成状态 → 下载图片 → 保存相簿与回读。当前状态：'+(names[t.status]||t.status||'等待'):t.kind==='summarize'?'选文确认 → 手机直连 DeepSeek → 接收摘要 → 写入备忘录并回读。当前状态：'+(names[t.status]||t.status||'等待'):'等待手机端实际动作';
text('resultHeading',t.title||'结果与保存验证');text('result',t.verified?'已验证 · '+(t.kind==='illustrate'?'图片与 cophone 相簿均回读确认':'系统备忘录保存后独立回读确认'):t.error||'尚未确认保存完成。');text('output',t.output);const hasPreview=t.kind==='illustrate'&&s.previewTaskID===t.id&&s.previewHash===t.imageHash;show('preview',hasPreview);if(hasPreview&&previewGeneration!==s.previewHash){el('preview').src='/preview.png?v='+encodeURIComponent(s.previewHash);previewGeneration=s.previewHash;}
}catch(e){text('badge','连接中断');el('badge').className='pill';}finally{setTimeout(update,1000)}}function updateSelection(){manual=true;}update();
</script></html>
